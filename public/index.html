<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<header class="header">
  <span class="header-brand">element³ — Policy Admin</span>
  <span class="header-store" id="store-name">Connecting…</span>
</header>

<!-- ── Layout ──────────────────────────────────────────────────────────────── -->
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <p class="sidebar-heading">Policies</p>
    <nav id="policy-nav"></nav>
  </aside>

  <!-- Main -->
  <div class="main">

    <!-- Section list -->
    <div class="list-pane">
      <div class="pane-header">
        <span class="pane-title" id="list-title">Sections</span>
        <button class="btn btn-primary btn-sm" onclick="startCreate()">+ New section</button>
      </div>
      <div class="section-items" id="section-list"></div>
    </div>

    <!-- Editor -->
    <div class="editor-pane placeholder" id="editor-pane">
      <p>Select a section to edit, or click <strong>+ New section</strong>.</p>
    </div>

  </div>
</div>

<!-- ── Overlays ─────────────────────────────────────────────────────────────── -->
<div class="toast" id="toast"></div>
<div class="loading" id="loading">Saving…</div>


<script>
'use strict';

// ── Config ────────────────────────────────────────────────────────────────────

const API_VERSION = '2025-01'; // Update in api/graphql.js too if bumped

const POLICIES = [
  { key: 'privacy',       label: 'Privacy Policy'         },
  { key: 'tc',            label: 'Terms & Conditions'      },
  { key: 'returns',       label: 'Returns Policy'          },
  { key: 'subscription',  label: 'Subscription Terms'      },
  { key: 'health-data',   label: 'Consumer Health Data'    },
  { key: 'reviews',       label: 'Reviews Policy'          },
  { key: 'accessibility', label: 'Accessibility Statement' },
  { key: 'medical',       label: 'Medical Disclaimer'      },
  { key: 'cookies',       label: 'Cookie Policy'           },
  { key: 'sourcing',      label: 'Ingredient Sourcing'     },
];

// ── State ─────────────────────────────────────────────────────────────────────

const state = {
  sections:     [],       // All policy_section metaobjects from Shopify
  activePolicy: 'privacy',
  editing:      null,     // Section object currently open in the editor
  isNew:        false,    // true = creating, false = editing existing
};

// ── GraphQL transport ─────────────────────────────────────────────────────────

async function gql(query, variables = {}) {
  const res = await fetch('/api/graphql', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ query, variables }),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
  const json = await res.json();
  if (json.errors?.length) throw new Error(json.errors.map(e => e.message).join('\n'));
  return json.data;
}

// ── GraphQL operations ────────────────────────────────────────────────────────

const Q_SHOP = `{ shop { name } }`;

const Q_SECTIONS = `
  query PolicySections($cursor: String) {
    metaobjects(type: "policy_section", first: 50, after: $cursor) {
      nodes {
        id
        handle
        fields { key value }
      }
      pageInfo { hasNextPage endCursor }
    }
  }
`;

const M_CREATE = `
  mutation PolicySectionCreate($metaobject: MetaobjectCreateInput!) {
    metaobjectCreate(metaobject: $metaobject) {
      metaobject { id handle fields { key value } }
      userErrors  { field message }
    }
  }
`;

const M_UPDATE = `
  mutation PolicySectionUpdate($id: ID!, $metaobject: MetaobjectUpdateInput!) {
    metaobjectUpdate(id: $id, metaobject: $metaobject) {
      metaobject { id handle fields { key value } }
      userErrors  { field message }
    }
  }
`;

const M_DELETE = `
  mutation PolicySectionDelete($id: ID!) {
    metaobjectDelete(id: $id) {
      deletedId
      userErrors { field message }
    }
  }
`;

// ── Data helpers ──────────────────────────────────────────────────────────────

function getField(section, key) {
  const f = (section.fields || []).find(f => f.key === key);
  return f ? (f.value ?? null) : null;
}

/** Sections for the active policy, sorted by section_number ascending. */
function activeSections() {
  return state.sections
    .filter(s => getField(s, 'policy_type') === state.activePolicy)
    .sort((a, b) => {
      const na = parseInt(getField(a, 'section_number') ?? 0, 10);
      const nb = parseInt(getField(b, 'section_number') ?? 0, 10);
      return na - nb;
    });
}

/** Derive a handle from policy type, section number, and heading. */
function buildHandle(policyType, sectionNum, heading) {
  const num  = String(sectionNum).padStart(2, '0');
  const slug = (heading || '')
    .toLowerCase()
    .replace(/[''`]/g, '')
    .replace(/[³²¹]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
  return `${policyType}-${num}-${slug}`;
}

// ── Load ──────────────────────────────────────────────────────────────────────

async function loadAll() {
  const shopData = await gql(Q_SHOP);
  document.getElementById('store-name').textContent = shopData.shop.name;

  let sections = [];
  let cursor   = null;
  do {
    const data = await gql(Q_SECTIONS, { cursor });
    sections   = sections.concat(data.metaobjects.nodes);
    cursor     = data.metaobjects.pageInfo.hasNextPage
      ? data.metaobjects.pageInfo.endCursor
      : null;
  } while (cursor);

  state.sections = sections;
}

async function reloadSections() {
  let sections = [];
  let cursor   = null;
  do {
    const data = await gql(Q_SECTIONS, { cursor });
    sections   = sections.concat(data.metaobjects.nodes);
    cursor     = data.metaobjects.pageInfo.hasNextPage
      ? data.metaobjects.pageInfo.endCursor
      : null;
  } while (cursor);
  state.sections = sections;
}

// ── Actions ───────────────────────────────────────────────────────────────────

function switchPolicy(key) {
  state.activePolicy = key;
  state.editing      = null;
  state.isNew        = false;
  render();
}

function startCreate() {
  state.editing = null;
  state.isNew   = true;
  render();
}

function startEdit(id) {
  state.editing = state.sections.find(s => s.id === id) ?? null;
  state.isNew   = false;
  render();
}

function cancelEdit() {
  state.editing = null;
  state.isNew   = false;
  render();
}

async function saveSection() {
  const form = document.getElementById('editor-form');
  if (!form) return;

  const numRaw  = form.section_number.value.trim();
  const eyebrow = form.eyebrow_label.value.trim();
  const heading = form.heading.value.trim();
  const bodyHtml = (document.getElementById('f-body')?.value ?? '');
  const body    = htmlToShopifyRichText(bodyHtml);

  if (!heading) return toast('Heading is required.', 'error');

  const sectionNum = parseInt(numRaw, 10) || (activeSections().length + 1);
  const handle     = buildHandle(state.activePolicy, sectionNum, heading);

  const fields = [
    { key: 'policy_type',    value: state.activePolicy },
    { key: 'section_number', value: String(sectionNum) },
    { key: 'eyebrow_label',  value: eyebrow            },
    { key: 'heading',        value: heading             },
    { key: 'body',           value: body                },
  ];

  showLoading(true);
  try {
    if (state.isNew) {
      const data = await gql(M_CREATE, { metaobject: { type: 'policy_section', handle, fields } });
      const errs = data.metaobjectCreate.userErrors;
      if (errs.length) throw new Error(errs.map(e => `${e.field}: ${e.message}`).join('\n'));
      state.sections.push(data.metaobjectCreate.metaobject);
      state.editing = data.metaobjectCreate.metaobject;
      state.isNew   = false;
      toast('Section created.', 'success');
    } else {
      const data = await gql(M_UPDATE, { id: state.editing.id, metaobject: { handle, fields } });
      const errs = data.metaobjectUpdate.userErrors;
      if (errs.length) throw new Error(errs.map(e => `${e.field}: ${e.message}`).join('\n'));
      const updated  = data.metaobjectUpdate.metaobject;
      state.sections = state.sections.map(s => s.id === updated.id ? updated : s);
      state.editing  = updated;
      toast('Section saved.', 'success');
    }
    render();
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    showLoading(false);
  }
}

async function deleteSection() {
  if (!state.editing) return;
  const heading = getField(state.editing, 'heading') || 'this section';
  if (!confirm(`Delete "${heading}"? This cannot be undone.`)) return;

  showLoading(true);
  try {
    const data = await gql(M_DELETE, { id: state.editing.id });
    const errs = data.metaobjectDelete.userErrors;
    if (errs.length) throw new Error(errs.map(e => e.message).join('\n'));
    state.sections = state.sections.filter(s => s.id !== state.editing.id);
    state.editing  = null;
    state.isNew    = false;
    toast('Section deleted.', 'success');
    render();
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    showLoading(false);
  }
}

async function moveSection(id, direction) {
  const siblings = activeSections();
  const idx      = siblings.findIndex(s => s.id === id);
  const swapIdx  = direction === 'up' ? idx - 1 : idx + 1;
  if (swapIdx < 0 || swapIdx >= siblings.length) return;

  const a    = siblings[idx];
  const b    = siblings[swapIdx];
  const numA = parseInt(getField(a, 'section_number') ?? idx + 1,     10);
  const numB = parseInt(getField(b, 'section_number') ?? swapIdx + 1, 10);

  showLoading(true);
  try {
    await Promise.all([
      gql(M_UPDATE, { id: a.id, metaobject: { fields: [{ key: 'section_number', value: String(numB) }] } }),
      gql(M_UPDATE, { id: b.id, metaobject: { fields: [{ key: 'section_number', value: String(numA) }] } }),
    ]);
    await reloadSections();
    render();
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    showLoading(false);
  }
}

// ── Rich-text converters ──────────────────────────────────────────────────────

/** Shopify rich-text AST → HTML that Trix can edit. */
function shopifyRichTextToHtml(value) {
  if (!value) return '';
  let ast;
  try { ast = JSON.parse(value); } catch { return value; }
  if (!ast || ast.type !== 'root') return String(value);
  return (ast.children || []).map(blockToHtml).join('');
}

function blockToHtml(node) {
  if (!node) return '';
  switch (node.type) {
    case 'paragraph':
      return `<div>${(node.children || []).map(inlineToHtml).join('')}</div>`;
    case 'heading': {
      const lvl = node.level || 2;
      return `<h${lvl}>${(node.children || []).map(inlineToHtml).join('')}</h${lvl}>`;
    }
    case 'list': {
      const tag = node.listType === 'ordered' ? 'ol' : 'ul';
      return `<${tag}>${(node.children || []).map(blockToHtml).join('')}</${tag}>`;
    }
    case 'list-item':
      return `<li>${(node.children || []).map(inlineToHtml).join('')}</li>`;
    default:
      return inlineToHtml(node);
  }
}

function inlineToHtml(node) {
  if (!node) return '';
  if (node.type === 'text') {
    let t = (node.value || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    if (node.bold)   t = `<strong>${t}</strong>`;
    if (node.italic) t = `<em>${t}</em>`;
    return t;
  }
  if (node.type === 'link') {
    const href = (node.url || '').replace(/"/g, '&quot;');
    return `<a href="${href}">${(node.children || []).map(inlineToHtml).join('')}</a>`;
  }
  return '';
}

/** Trix HTML output → Shopify rich-text AST (JSON string). */
function htmlToShopifyRichText(html) {
  const empty = JSON.stringify({
    type: 'root',
    children: [{ type: 'paragraph', children: [{ type: 'text', value: '' }] }],
  });
  if (!html || !html.trim()) return empty;

  const doc = new DOMParser().parseFromString(`<body>${html}</body>`, 'text/html');

  function parseInline(el) {
    const nodes = [];
    for (const child of el.childNodes) {
      if (child.nodeType === Node.TEXT_NODE) {
        const v = child.textContent;
        if (v) nodes.push({ type: 'text', value: v });
      } else if (child.nodeType === Node.ELEMENT_NODE) {
        const tag = child.tagName.toLowerCase();
        if (tag === 'br') continue;
        if (tag === 'strong' || tag === 'b') {
          parseInline(child).forEach(n => nodes.push(n.type === 'text' ? { ...n, bold: true } : n));
        } else if (tag === 'em' || tag === 'i') {
          parseInline(child).forEach(n => nodes.push(n.type === 'text' ? { ...n, italic: true } : n));
        } else if (tag === 'a') {
          nodes.push({ type: 'link', url: child.getAttribute('href') || '', children: parseInline(child) });
        } else {
          nodes.push(...parseInline(child));
        }
      }
    }
    return nodes;
  }

  function parseBlock(el) {
    const tag = el.tagName?.toLowerCase();
    if (!tag) return null;
    if (tag === 'div' || tag === 'p') {
      const inlines = parseInline(el);
      return { type: 'paragraph', children: inlines.length ? inlines : [{ type: 'text', value: '' }] };
    }
    if (tag === 'ul' || tag === 'ol') {
      return {
        type: 'list',
        listType: tag === 'ol' ? 'ordered' : 'unordered',
        children: [...el.querySelectorAll(':scope > li')].map(li => ({
          type: 'list-item',
          children: parseInline(li),
        })),
      };
    }
    if (/^h[1-6]$/.test(tag)) {
      return { type: 'heading', level: parseInt(tag[1]), children: parseInline(el) };
    }
    return null;
  }

  const children = [...doc.body.children].map(parseBlock).filter(Boolean);
  return JSON.stringify({ type: 'root', children: children.length ? children : [{ type: 'paragraph', children: [{ type: 'text', value: '' }] }] });
}

// ── Render ────────────────────────────────────────────────────────────────────

function render() {
  renderNav();
  renderList();
  renderEditor();
}

function renderNav() {
  document.getElementById('policy-nav').innerHTML = POLICIES.map(p => {
    const count  = state.sections.filter(s => getField(s, 'policy_type') === p.key).length;
    const active = p.key === state.activePolicy ? 'active' : '';
    return `
      <div class="nav-item ${active}" onclick="switchPolicy('${p.key}')">
        ${esc(p.label)}
        <span class="nav-count">${count}</span>
      </div>`;
  }).join('');
}

function renderList() {
  const policy   = POLICIES.find(p => p.key === state.activePolicy);
  const sections = activeSections();

  document.getElementById('list-title').textContent = policy.label;

  const list = document.getElementById('section-list');
  if (!sections.length) {
    list.innerHTML = `<div class="empty-state">No sections yet.<br>Click <strong>+ New section</strong> to add one.</div>`;
    return;
  }

  list.innerHTML = sections.map((s, i) => {
    const num     = getField(s, 'section_number') ?? (i + 1);
    const heading = getField(s, 'heading')        ?? '(untitled)';
    const eyebrow = getField(s, 'eyebrow_label')  ?? '';
    const active  = state.editing?.id === s.id ? 'active' : '';
    const isFirst = i === 0;
    const isLast  = i === sections.length - 1;
    const sid     = escAttr(s.id);

    return `
      <div class="section-item ${active}" onclick="startEdit('${sid}')">
        <div class="item-row">
          <div class="item-meta">
            <div class="item-num">Section ${num}</div>
            <div class="item-heading">${esc(heading)}</div>
            ${eyebrow ? `<div class="item-eyebrow">${esc(eyebrow)}</div>` : ''}
          </div>
          <div class="item-reorder" onclick="event.stopPropagation()">
            <button class="reorder-btn" title="Move up"
              ${isFirst ? 'disabled' : `onclick="moveSection('${sid}','up')"`}>▲</button>
            <button class="reorder-btn" title="Move down"
              ${isLast  ? 'disabled' : `onclick="moveSection('${sid}','down')"`}>▼</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

function renderEditor() {
  const pane = document.getElementById('editor-pane');

  if (!state.editing && !state.isNew) {
    pane.className = 'editor-pane placeholder';
    pane.innerHTML = '<p>Select a section to edit, or click <strong>+ New section</strong>.</p>';
    return;
  }

  pane.className = 'editor-pane';

  const s        = state.editing;
  const nextNum  = activeSections().length + 1;
  const num      = s ? (getField(s, 'section_number') ?? nextNum) : nextNum;
  const eyebrow  = s ? (getField(s, 'eyebrow_label')  ?? '') : '';
  const heading  = s ? (getField(s, 'heading')         ?? '') : '';
  const body     = s ? (getField(s, 'body')            ?? '') : '';
  const title    = state.isNew ? 'New section' : esc(heading) || 'Edit section';
  const previewHandle = buildHandle(state.activePolicy, num, heading);

  const bodyHtml = shopifyRichTextToHtml(body);

  pane.innerHTML = `
    <div class="form-wrap">
      <div class="editor-header">
        <h2 class="editor-title">${title}</h2>
        <div class="editor-actions">
          ${s ? `<button class="btn btn-danger btn-sm" onclick="deleteSection()">Delete</button>` : ''}
          <button class="btn btn-secondary btn-sm" onclick="cancelEdit()">Cancel</button>
          <button class="btn btn-primary btn-sm" onclick="saveSection()">Save</button>
        </div>
      </div>

      <form id="editor-form" onsubmit="event.preventDefault(); saveSection()">

        <div class="field-row">
          <div class="field-group">
            <label class="field-label" for="f-num">Section Number</label>
            <input class="input input-narrow" type="number" id="f-num"
                   name="section_number" value="${escAttr(num)}" min="1"
                   oninput="updateHandlePreview()">
            <p class="field-hint">Controls display order.</p>
          </div>
          <div class="field-group">
            <label class="field-label" for="f-eyebrow">Eyebrow Label</label>
            <input class="input" type="text" id="f-eyebrow"
                   name="eyebrow_label" value="${escAttr(eyebrow)}"
                   placeholder="e.g. Introduction">
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="f-heading">
            Heading <span class="field-req">*</span>
          </label>
          <input class="input" type="text" id="f-heading"
                 name="heading" value="${escAttr(heading)}"
                 placeholder="Section heading" required
                 oninput="updateHandlePreview()">
          <p class="handle-preview">Handle: <span id="handle-preview">${esc(previewHandle)}</span></p>
        </div>

        <div class="field-group">
          <label class="field-label" for="f-body">Body</label>
          <input type="hidden" id="f-body" name="body">
          <trix-editor input="f-body" id="f-body-editor"></trix-editor>
        </div>

      </form>
    </div>`;

  // Load body content into Trix
  const trixEl = pane.querySelector('trix-editor');
  if (trixEl) {
    const load = () => trixEl.editor.loadHTML(bodyHtml);
    if (trixEl.editor) { load(); }
    else { trixEl.addEventListener('trix-initialize', load, { once: true }); }
  }
}

function updateHandlePreview() {
  const form = document.getElementById('editor-form');
  if (!form) return;
  const num     = parseInt(form.section_number.value, 10) || 1;
  const heading = form.heading.value;
  const preview = document.getElementById('handle-preview');
  if (preview) preview.textContent = buildHandle(state.activePolicy, num, heading);
}

// ── UI utilities ──────────────────────────────────────────────────────────────

function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escAttr(str) { return String(str ?? '').replace(/"/g, '&quot;'); }

let _toastTimer;
function toast(msg, type = 'success') {
  const el    = document.getElementById('toast');
  el.textContent = msg;
  el.className   = `toast show ${type}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = 'toast'; }, 3500);
}

function showLoading(show) {
  document.getElementById('loading').className = `loading${show ? ' show' : ''}`;
}

// ── Initialise ────────────────────────────────────────────────────────────────

(async function init() {
  try {
    await loadAll();
    render();
  } catch (err) {
    document.body.style.cssText = 'padding:48px;font-family:monospace';
    document.body.innerHTML = `
      <strong style="color:#dc2626">Failed to connect to Shopify.</strong><br><br>
      ${esc(err.message)}<br><br>
      <span style="color:#555">Check that <code>SHOPIFY_ACCESS_TOKEN</code> is set in Vercel
      Environment Variables and that the token has the required scopes.</span>`;
  }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/trix@2.1.4/dist/trix.umd.min.js"></script>
</body>
</html>
